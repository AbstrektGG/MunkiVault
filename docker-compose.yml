# Copy .env.example to .env, set MUNKIVAULT_MASTER_KEY and POSTGRES_PASSWORD, then: docker compose up -d
services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: munki
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: munkivault
    volumes:
      - munkivault-db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U munki -d munkivault"]
      interval: 5s
      retries: 10

  app:
    build: .
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    env_file: .env
    environment:
      DATABASE_URL: postgres://munki:${POSTGRES_PASSWORD}@db:5432/munkivault
    ports:
      - "3000:3000"

volumes:
  munkivault-db:
